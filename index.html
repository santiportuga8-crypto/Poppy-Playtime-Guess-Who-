<style>

/* =========================================================
   POPPY PLAYTIME - GUESS WHO
   BLACK AND WHITE + RED AND WHITE THEME
========================================================= */

@import url(
    'https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap'
);


/* =========================================================
   GLOBAL
========================================================= */

* {

    box-sizing:
        border-box;

    margin:
        0;

    padding:
        0;

}


html {

    image-rendering:
        pixelated;

}


body {

    min-height:
        100vh;

    background:
        #000;

    color:
        #fff;

    font-family:
        "Press Start 2P",
        monospace;

    overflow-x:
        hidden;

}


/* =========================================================
   TOP BAR
========================================================= */

.top-bar {

    width:
        100%;

    padding:
        30px 20px 35px;

    text-align:
        center;

    background:
        #000;

    border-bottom:
        5px solid #fff;

}


/* =========================================================
   POPPY PLAYTIME
========================================================= */

.poppy-playtime-text {

    color:
        #fff;

    font-size:
        clamp(
            12px,
            2.5vw,
            24px
        );

    line-height:
        1.5;

    margin-bottom:
        12px;

    letter-spacing:
        3px;

}


/* =========================================================
   GUESS WHO
========================================================= */

.top-bar h1 {

    font-size:
        clamp(
            18px,
            4vw,
            42px
        );

    line-height:
        1.5;

}


/* =========================================================
   RED AND WHITE GUESS WHO TEXT
========================================================= */

.red-white-text {

    background:
        linear-gradient(
            90deg,

            #ff0000 0%,
            #ffffff 25%,
            #ff0000 50%,
            #ffffff 75%,
            #ff0000 100%
        );

    background-size:
        300% 100%;

    -webkit-background-clip:
        text;

    background-clip:
        text;

    -webkit-text-fill-color:
        transparent;

    animation:
        redWhiteMove
        3s
        linear
        infinite;

    filter:
        drop-shadow(
            4px 4px 0 #fff
        );

}


@keyframes redWhiteMove {

    0% {

        background-position:
            0% 50%;

    }

    50% {

        background-position:
            100% 50%;

    }

    100% {

        background-position:
            0% 50%;

    }

}


/* =========================================================
   RESTORE ALL BUTTON
========================================================= */

.restore-container {

    width:
        100%;

    display:
        flex;

    justify-content:
        center;

    padding:
        25px 20px 0;

}


.restore-button {

    padding:
        15px 22px;

    background:
        #fff;

    color:
        #000;

    border:
        4px solid #fff;

    box-shadow:
        5px 5px 0 #555;

    font-family:
        "Press Start 2P",
        monospace;

    font-size:
        9px;

    cursor:
        pointer;

    transition:
        transform 0.12s,
        box-shadow 0.12s;

}


.restore-button:hover {

    transform:
        translate(
            -3px,
            -3px
        );

    box-shadow:
        8px 8px 0 #777;

}


.restore-button:active {

    transform:
        translate(
            2px,
            2px
        );

    box-shadow:
        2px 2px 0 #555;

}


/* =========================================================
   CHARACTER BOARD
========================================================= */

.character-board {

    width:
        100%;

    max-width:
        1500px;

    margin:
        40px auto;

    padding:
        0 25px 60px;

    display:
        grid;

    grid-template-columns:
        repeat(
            auto-fill,
            minmax(
                190px,
                1fr
            )
        );

    gap:
        25px;

}


/* =========================================================
   CHARACTER CARD
========================================================= */

.character-card {

    position:
        relative;

    background:
        #fff;

    border:
        5px solid #fff;

    cursor:
        pointer;

    box-shadow:
        7px 7px 0 #555;

    transition:
        transform 0.12s,
        filter 0.12s,
        box-shadow 0.12s;

}


.character-card:hover {

    transform:
        translate(
            -4px,
            -4px
        );

    box-shadow:
        11px 11px 0 #777;

}


/* =========================================================
   CHARACTER IMAGE
========================================================= */

.character-image {

    width:
        100%;

    height:
        230px;

    background:
        #000;

    border-bottom:
        5px solid #000;

    overflow:
        hidden;

}


/* =========================================================
   STRETCH IMAGE TO FILL
========================================================= */

.character-image img {

    width:
        100%;

    height:
        100%;

    display:
        block;

    object-fit:
        fill;

    image-rendering:
        pixelated;

}


/* =========================================================
   CHARACTER NAME
========================================================= */

.character-name {

    min-height:
        60px;

    padding:
        14px 10px 8px;

    display:
        flex;

    align-items:
        center;

    justify-content:
        center;

    text-align:
        center;

    background:
        #fff;

    color:
        #000;

    font-size:
        10px;

    line-height:
        1.7;

}


/* =========================================================
   CHAPTER INFORMATION
========================================================= */

.character-chapter {

    min-height:
        55px;

    padding:
        8px 10px 14px;

    display:
        flex;

    align-items:
        center;

    justify-content:
        center;

    text-align:
        center;

    background:
        #fff;

    color:
        #555;

    font-size:
        7px;

    line-height:
        1.7;

}


/* =========================================================
   ELIMINATED CHARACTER
========================================================= */

.character-card.eliminated {

    filter:
        grayscale(1)
        brightness(0.35);

    opacity:
        0.55;

}


/* =========================================================
   ELIMINATION CROSS
========================================================= */

.character-card.eliminated::before {

    content:
        "";

    position:
        absolute;

    top:
        50%;

    left:
        50%;

    width:
        90%;

    height:
        10px;

    background:
        #fff;

    border:
        4px solid #000;

    transform:
        translate(
            -50%,
            -50%
        )
        rotate(-15deg);

    z-index:
        5;

}


/* =========================================================
   ELIMINATED TEXT
========================================================= */

.character-card.eliminated::after {

    content:
        "ELIMINATED";

    position:
        absolute;

    top:
        50%;

    left:
        50%;

    transform:
        translate(
            -50%,
            -50%
        );

    padding:
        10px;

    background:
        #000;

    border:
        4px solid #fff;

    color:
        #fff;

    font-size:
        8px;

    white-space:
        nowrap;

    z-index:
        6;

}


/* =========================================================
   RESPONSIVE
========================================================= */

@media (
    max-width: 700px
) {

    .character-board {

        grid-template-columns:
            repeat(
                2,
                1fr
            );

        gap:
            12px;

        padding:
            0 12px 30px;

    }


    .character-image {

        height:
            170px;

    }


    .character-name {

        font-size:
            8px;

        min-height:
            50px;

    }


    .character-chapter {

        font-size:
            6px;

        min-height:
            48px;

    }


    .top-bar {

        padding:
            25px 10px;

    }

}


@media (
    max-width: 400px
) {

    .character-board {

        grid-template-columns:
            1fr;

    }

}

</style>

                );

        );

);

   RESTORE ALL CHARACTERS
